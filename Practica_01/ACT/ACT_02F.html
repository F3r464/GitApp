<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Tabla de Animales con Colspan y Rowspan</title>
    <style>
        html {
            font-family: sans-serif;
        }
        table {
            border-collapse: collapse;
            border: 2px solid rgb(200,200,200);
            letter-spacing: 1px;
            font-size: 0.8rem;
        }
        td, th {
            border: 1px solid rgb(190,190,190);
            padding: 10px 20px;
        }
        th {
            background-color: rgb(235,235,235);
        }
        td {
            text-align: center;
        }
        tr:nth-child(even) td {
            background-color: rgb(250,250,250);
        }
        tr:nth-child(odd) td {
            background-color: rgb(245,245,245);
        }
    </style>
</head>
<body>

    <h1>Tabla Compleja de Animales</h1>

    <table>
        <tr>
            <th colspan="2">Animales</th>
            <th>Categoría</th>
            <th>Hábitat</th>
        </tr>
        <tr>
            <td rowspan="3">Caballo</td>
            <td>Pura Sangre</td>
            <td>Mamífero</td>
            <td>Tierra</td>
        </tr>
        <tr>
            <td>Percherón</td>
            <td>Mamífero</td>
            <td>Tierra</td>
        </tr>
        <tr>
            <td>Ponni</td>
            <td>Mamífero</td>
            <td>Tierra</td>
        </tr>
        <tr>
            <td colspan="2">Hipopótamo</td>
            <td>Mamífero</td>
            <td>Agua / Tierra</td>
        </tr>
        <tr>
            <td colspan="2">Cocodrilo</td>
            <td>Reptil</td>
            <td>Agua / Tierra</td>
        </tr>
        <tr>
            <td rowspan="3">Pollo</td>
            <td>Gallo</td>
            <td>Ave</td>
            <td>Tierra</td>
        </tr>
        <tr>
            <td>Gallina</td>
            <td>Ave</td>
            <td>Tierra</td>
        </tr>
        <tr>
            <td>Polluelo</td>
            <td>Ave</td>
            <td>Tierra</td>
        </tr>
    </table>

</body>
</html>
