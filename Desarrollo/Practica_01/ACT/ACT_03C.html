<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Encabezados en tablas</title>
    <style>
        html {
            font-family: sans-serif;
        }
        table {
            border-collapse: collapse;
            border: 2px solid rgb(200,200,200);
            letter-spacing: 1px;
            font-size: 0.9rem;
            width: 400px;
        }
        td, th {
            border: 1px solid rgb(190,190,190);
            padding: 10px 20px;
        }
        th {
            background-color: rgb(235,235,235);
        }
        td {
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>Tabla</h1>

    <table>
        <colgroup>
            <col>
            <col style="background-color: yellow;">
        </colgroup>

        <tr>
            <th>Dato 1 (Raza)</th>
            <th>Dato 2 (Gustos)</th>
        </tr>

        <tr>
            <td>Calcuta</td>
            <td>Pizza</td>
        </tr>
        <tr>
            <td>Robots</td>
            <td>Jazz</td>
        </tr>
    </table>

</body>
</html>
