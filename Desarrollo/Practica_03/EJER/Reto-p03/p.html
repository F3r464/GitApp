<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Experiencia 01 - Grid</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <!-- 1. Reemplazado por la clase .container para un contenedor responsivo -->
  <div class="container">
    <h2 class="text-center mt-4 mb-4">Nuestros Servicios</h2>

    <!-- 2. Añadida la clase .row para envolver los artículos en una fila -->
    <!-- Se incluye g-4 (gutter) opcional para dar un espaciado estético entre columnas -->
    <div class="row g-4">
      
      <!-- 3. Modificadas las clases de los artículos para la responsividad -->
      <!-- col-12: 100% en móvil | col-md-6: 50% en tablet | col-lg-4: 33.33% en escritorio -->
      <div class="col-12 col-md-6 col-lg-4">
        <div class="p-3 border bg-light h-100">
          <h4>Auditoría de Sistemas</h4>
          <p>Evaluación exhaustiva de la infraestructura tecnológica.</p>
        </div>
      </div>

      <div class="col-12 col-md-6 col-lg-4">
        <div class="p-3 border bg-light h-100">
          <h4>Desarrollo a Medida</h4>
          <p>Creación de software adaptado a las necesidades empresariales.</p>
        </div>
      </div>

      <div class="col-12 col-md-6 col-lg-4">
        <div class="p-3 border bg-light h-100">
          <h4>Ciberseguridad</h4>
          <p>Protección de activos de información y análisis de vulnerabilidades.</p>
        </div>
      </div>

    </div>
  </div>
</body>
</html>
